# bm-minecraft-the-end-plus 設定檔

# 終界重置功能總開關。關閉時一般玩家不能使用 /the-end-reset。
enabled: true

# 成功使用 /the-end-reset 後，一般玩家再次使用前必須等待的分鐘數。
# OP、控制台不受此限制。可設 0 至 10080（七天），預設 30。
reset-cooldown-minutes: 30

# true 時，遊戲內管理指令需要 OP；控制台始終可管理。
admin-require-op: true

# 水晶復活後再次擊殺龍時，恢復首次擊殺狀態與 12000 經驗（遵守 mob_drops）。
# 返回門、龍蛋、折躍門由原版結算；不額外生成第二座門。
# 指令重置時強制清龍不發獎勵。此設定不影響中央四區重置。
restore-first-experience: true
